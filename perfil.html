<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conexão Cidadã - Meu Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* Estilos específicos para centralizar o cartão e bater com o layout das imagens */
    body {
      background-color: #f4f6f7;
      margin: 0;
    }

    .profile-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 120px);
      padding: 2rem;
      box-sizing: border-box;
    }

    .profile-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      box-sizing: border-box;
    }

    /* Área da Foto de Perfil Interativa */
    .profile-avatar-container {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      cursor: pointer;
      overflow: hidden;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      background-color: #e8f4ea; 
      color: #1c5234; 
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      border-radius: 50%;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .avatar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s ease;
      border-radius: 50%;
    }

    .profile-avatar-container:hover .avatar-overlay {
      opacity: 1;
    }

    /* Textos Principais e Selos */
    .profile-name {
      font-family: 'Sora', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #111;
      margin: 0 0 0.5rem 0;
    }

    .profile-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 2rem;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Formulário de Configurações */
    .profile-form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 1.8rem;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .form-group label {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: #111;
      margin-bottom: 0.6rem;
    }

    .form-group input {
      font-family: 'Inter', sans-serif;
      background-color: #f1f3f4;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 1rem;
      font-size: 1rem;
      color: #333;
      outline: none;
      box-sizing: border-box;
      width: 100%;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .form-group input:focus {
      border-color: #4caf50;
      background-color: #ffffff;
    }

    .btn-salvar {
      font-family: 'Inter', sans-serif;
      background-color: #4caf50; 
      color: white;
      border: none;
      border-radius: 12px;
      padding: 1.1rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }

    .btn-salvar:hover {
      background-color: #43a047;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo-container">
    <img src="conexãocidadanobg.png" alt="Conexão Cidadã" class="logo-img">
  </a>
  <div class="nav-links" id="nav-actions">
    <a href="login.html" class="btn-outline">Entrar</a>
    <a href="cadastro.html" class="btn-filled">Cadastrar</a>
  </div>
</nav>

<main class="profile-container">
  <div class="profile-card">
    
    <!-- Avatar Clicável -->
    <div class="profile-avatar-container" onclick="document.getElementById('file-input').click()" title="Clique para alterar a foto">
      <div class="profile-avatar" id="avatar-preview">
        <span id="avatar-letter">P</span>
      </div>
      <div class="avatar-overlay">
        <span>Alterar</span>
      </div>
    </div>
    
    <!-- Input Oculto de upload -->
    <input type="file" id="file-input" accept="image/*" style="display: none;">

    <!-- Título do Nome -->
    <h2 class="profile-name" id="profile-display-name">Carregando...</h2>
    
    <!-- Selo do Tipo Dinâmico -->
    <div class="profile-badge" id="profile-badge">
      👋 Perfil de Voluntário
    </div>

    <!-- Campos de Entrada -->
    <form class="profile-form" id="profile-form">
      <div class="form-group">
        <label for="profile-email">E-mail da Conta</label>
        <input type="email" id="profile-email" value="" placeholder="seu-email@gmail.com" required>
      </div>

      <button type="submit" class="btn-salvar">Salvar Alterações</button>
    </form>

  </div>
</main>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const navActions = document.getElementById('nav-actions');
    const usuarioLogado = localStorage.getItem('conectado');
    
    // Captura os dados salvos ou define fallbacks padrões
    const nomeUsuario = localStorage.getItem('nomeUsuario') || "Usuário";
    const tipoUsuario = localStorage.getItem('tipoUsuario') || "voluntario"; 
    const emailUsuario = localStorage.getItem('emailUsuario') || "exemplo@gmail.com";

    // Elementos do DOM
    const avatarPreview = document.getElementById('avatar-preview');
    const avatarLetter = document.getElementById('avatar-letter');
    const profileDisplayName = document.getElementById('profile-display-name');
    const profileEmailInput = document.getElementById('profile-email');
    const fileInput = document.getElementById('file-input');
    const profileForm = document.getElementById('profile-form');
    const profileBadge = document.getElementById('profile-badge');

    // 1. Guarda de segurança para páginas privadas
    if (usuarioLogado !== 'sim') {
      alert('Acesso negado. Por favor, realize o login primeiro.');
      window.location.href = 'login.html';
      return;
    }

    // 2. Renderiza a Navbar em modo conectado
    navActions.innerHTML = `
      <a href="perfil.html" class="nav-profile-link" style="color: #fff; font-weight: 600; font-size: 0.875rem; margin-right: 15px; display: inline-block; vertical-align: middle; text-decoration: none; transition: opacity 0.2s;">
        Olá, ${nomeUsuario} 👋
      </a>
      <a href="#" id="btn-sair" class="btn-outline">Sair</a>
    `;

    document.getElementById('btn-sair').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.setItem('conectado', 'nao');
      window.location.href = 'index.html';
    });

    // 3. Aplica os dados do usuário nas tags correspondentes
    profileDisplayName.textContent = nomeUsuario;
    profileEmailInput.value = emailUsuario;
    avatarLetter.textContent = nomeUsuario.charAt(0).toUpperCase();
    
    // 4. Valida dinamicamente o tipo de conta para ajustar o Badge
    if (tipoUsuario === 'ong') {
      profileBadge.innerHTML = '🏢 Perfil de ONG';
      profileBadge.style.backgroundColor = '#e8f5e9'; // Fundo Verde
      profileBadge.style.color = '#2e7d32';           // Texto Verde Escuro
    } else {
      profileBadge.innerHTML = '👋 Perfil de Voluntário';
      profileBadge.style.backgroundColor = '#e3f2fd'; // Fundo Azul
      profileBadge.style.color = '#1e88e5';           // Texto Azul Escuro
    }

    // 5. Carrega a imagem persistida se existir no LocalStorage
    const fotoSalva = localStorage.getItem('fotoPerfil');
    if (fotoSalva) {
      avatarPreview.innerHTML = `<img src="${fotoSalva}" alt="Foto de Perfil">`;
    }

    // 6. Monitora o upload local da nova imagem
    fileInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.addEventListener('load', function() {
          const dataUrl = reader.result;
          localStorage.setItem('fotoPerfil', dataUrl);
          avatarPreview.innerHTML = `<img src="${dataUrl}" alt="Foto de Perfil">`;
        });
        reader.readAsDataURL(file);
      }
    });

    // 7. Salva alterações textuais do formulário
    profileForm.addEventListener('submit', (e) => {
      e.preventDefault();
      localStorage.setItem('emailUsuario', profileEmailInput.value);
      alert('Alterações salvas com sucesso!');
      window.location.reload();
    });
  });
</script>
</body>
</html>
