<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscrição - Conexão Cidadã</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
   <a href="index.html" class="logo-container">
    <img src="conexãocidadanobg.png" alt="Conexão Cidadã" class="logo-img">
  </a>
    <div class="nav-links">
      <a href="index.html" class="nav-links btn-outline">Voltar ao Início</a>
    </div>
  </nav>

  <div class="inscricao-container" style="margin-top: 6rem; display: flex; justify-content: center; width: 100%;">
    <div class="ong-form" style="width: 100%; max-width: 500px;">
      <h2>Confirmar sua Inscrição</h2>
      <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Defina sua disponibilidade e finalize para enviar seus dados organizacionais.</p>
      
      <form id="form-finalizar-inscricao">
        <div class="input-group">
          <label for="vol-nome-readonly">Nome do Voluntário</label>
          <input type="text" id="vol-nome-readonly" readonly style="background: #f0f0f0; cursor: not-allowed;">
        </div>

        <h3 class="section-title" style="color: var(--teal-mid); font-weight: 600; margin: 1.5rem 0 1rem; font-size: 1.1rem;">Disponibilidade Presencial:</h3>
        
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" name="horario1"> Segunda (10:00 até 19:00)
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="horario2"> Quarta (12:00 até 22:30)
          </label>
        </div>

        <h3 class="section-title" style="color: var(--teal-mid); font-weight: 600; margin: 1.5rem 0 1rem; font-size: 1.1rem;">Apoio Financeiro Alternativo:</h3>
        <button type="button" class="btn-pix" style="width: 100%; margin-bottom: 1.5rem;" onclick="alert('Chave PIX copiada com sucesso!')">
          Copiar chave-pix da ONG ⧉
        </button>

        <button type="submit" class="btn-finalizar" style="width: 100%; padding: 12px; background: var(--green-dark); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Finalizar Inscrição</button>
      </form>
    </div>
  </div>

  <script>
    // Trava de Segurança de Login
    if (localStorage.getItem('conectado') !== 'sim') {
      alert('Acesso negado. Faça login para acessar esta página.');
      window.location.href = 'login.html';
    } else {
      document.getElementById('vol-nome-readonly').value = localStorage.getItem('nomeUsuario');
    }

    // Ação do formulário
    document.getElementById('form-finalizar-inscricao').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Sua candidatura foi enviada com sucesso para a ONG selecionada!');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
